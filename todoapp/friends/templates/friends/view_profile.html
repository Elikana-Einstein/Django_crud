{% extends 'base.html' %}
{% block content %}

<div class="max-w-4xl mx-auto mt-10 bg-white rounded-lg shadow-lg p-8">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Update Profile</h2>
  
  <form class="space-y-6" action="{% url 'friends:edit_profile' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <!-- Cover Photo Upload -->
    <div class="mb-8">
      <label class="block text-sm font-medium text-gray-700 mb-2">Cover Photo</label>
      <div class="relative group h-40">
        <img 
          src="{% if profile.cover_photo %}{{ profile.cover_photo.url }}{% else %}https://via.placeholder.com/800x200{% endif %}" 
          alt="Cover photo" 
          class="w-full h-full object-cover rounded-lg border-2 border-gray-200"
        >
        <div class="absolute inset-0 bg-black bg-opacity-40 rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </div>
        <input 
          type="file" 
          id="cover_photo" 
          name="cover_photo" 
          class="hidden"
          value="{{ profile.profile_picture }}"
          accept="image/*"
        >
        <label for="cover_photo" class="absolute inset-0 cursor-pointer"></label>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-8 items-start">
      <!-- Profile Picture Upload -->
      <div class="flex-shrink-0 relative group">
        <img 
          src="{{ profile.profile_picture.url }}" 
          alt="Profile pictures" 
          class="w-32 h-32 rounded-full border-4 border-blue-200 object-cover"
        >
        <div class="absolute inset-0 bg-black bg-opacity-40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </div>
        <input 
          type="file" 
          id="profile_pic" 
          name="profile_picture" 
          class="hidden"
          accept="image/*"
          onchange="previewImage(event)"
         
        >
        <label for="profile_pic" class="absolute inset-0 cursor-pointer"></label>
      </div>

      <!-- Form Fields -->
      <div class="flex-grow space-y-4 w-full">
        <!-- Username Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input 
            type="text" 
            name="username" 
            value="{{ profile.user.username }}" 
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
          >
        </div>

        <!-- Name Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
            <input 
              type="text" 
              name="firstname" 
              value="{{ profile.firstname }}" 
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input 
              type="text" 
              name="lastname" 
              value="{{ profile.lastname }}" 
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            >
          </div>
        </div>

        <!-- Contact Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input 
              type="email" 
              name="email" 
              value="{{ profile.email }}" 
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
            <input 
              type="text" 
              name="location" 
              value="{{ profile.location }}" 
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            >
          </div>
        </div>

        <!-- Bio Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
          <textarea 
            name="bio" 
            rows="3" 
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
          >{{ profile.bio }}</textarea>
        </div>

        <!-- Website Field -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
          <input 
            type="url" 
            name="website" 
            value="{{ profile.website }}" 
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="https://example.com"
          >
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end gap-4">
      <a href="{% url 'friends:my_profile' %}" class="px-6 py-2 text-gray-600 hover:text-gray-800 transition-colors">Cancel</a>
      <button 
        type="submit" 
        class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        Update Profile
      </button>
    </div>
  </form>
</div>

{% endblock %}
