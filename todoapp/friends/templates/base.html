<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>





      const mobileMenuButton = document.getElementById('mobile-menu-button');
      const mobileMenu = document.getElementById('mobile-menu');
      const menuIcon = mobileMenuButton.querySelector('svg:nth-of-type(1)');
      const closeIcon = mobileMenuButton.querySelector('svg:nth-of-type(2)');
      
      mobileMenuButton.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        menuIcon.classList.toggle('hidden');
        closeIcon.classList.toggle('hidden');
      });
      </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-500 shadow-md rounded-b-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <a href="#" class="text-white font-bold text-xl">My Tasks</a>
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a href="#" class="text-gray-300 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
              <a href="{% url 'get_friends_task' %}" class="text-gray-300 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Tasks</a>
              <a href="{% url 'friends:list_friends' %}" class="text-gray-300 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Friends</a>
            </div>
          </div>
        </div>
        {% if user.is_authenticated %}
        <div class="hidden md:block">
          <div class="ml-4 flex items-center">
            <a href="{% url 'friends:my_profile' %}">
            <p class="cursor-pointer">{{ user.username }}</p>
        </a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="text-gray-300 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Logout</button>
          </form>
          </div>
        </div>
        {% else %}
        <div class="hidden md:block">
          <div class="ml-4 flex items-center">
            <a href="#" class="text-gray-300 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Login</a>
          </div>
        </div>
        {% endif %}
        <div class="-mr-2 flex md:hidden">
          <button id="mobile-menu-button" class="bg-blue-600 inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" aria-controls="mobile-menu" aria-expanded="false">
            <span class="sr-only">Open main menu</span>
            <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  
    <div class="md:hidden" id="mobile-menu">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        <a href="#" class="bg-blue-600 text-white block px-3 py-2 rounded-md text-base font-medium">Home</a>
        <a href="#" class="text-gray-300 hover:bg-blue-600 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Tasks</a>
        <a href="#" class="text-gray-300 hover:bg-blue-600 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Create Task</a>
        <a href="#" class="text-gray-300 hover:bg-blue-600 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Logout</a>
      </div>
    </div>
  </nav>
  
 
  

    {% block content %}

    {% endblock %}
    <script>
      document.addEventListener("DOMContentLoaded", function() {
          var input = document.getElementById("profile_picture");
          
          input.addEventListener("change", function(event) {
              var reader = new FileReader();
              reader.onload = function(){
                  var imgElement = document.getElementById("image_preview");
                  imgElement.src = reader.result;
                  imgElement.style.display = "block"; 
              };
              reader.readAsDataURL(event.target.files[0]);
          });
      });
      </script>
      
</body>
</html>
