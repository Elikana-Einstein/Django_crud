{% extends 'base.html' %}
{% block content %}
<div class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Update Your Task</h1>
        <form action="{% url 'update_task' task_id=task.id %}" method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="title" class="block text-gray-700 text-sm font-bold mb-2">Title:</label>
                <input type="text" id="title" value="{{ task.title }}" name="title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div>
                <label for="description" class="block text-gray-700 text-sm font-bold mb-2">Description:</label>
                <textarea id="description" name="description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ task.description }}</textarea>
            </div>
            <div>
                <label for="due_date" class="block text-gray-700 text-sm font-bold mb-2">Due Date:</label>
                <input type="date" value="{{ form.initial.due_date }}" id="due_date" name="due_date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                Update Task
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'task_list' %}" class="text-blue-500 hover:underline text-sm">Back to Task List</a>
        </div>
    </div>
</div>
{% endblock %}
